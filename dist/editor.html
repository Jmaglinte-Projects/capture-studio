<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screenshot editor · Capture Studio</title><link rel="stylesheet" href="assets/css/editor.css"><link rel="stylesheet" href="assets/css/dropdown.css"></head><body>
<header><a href="index.html" class="brand">◉ <b>Capture Studio</b> <span>/ Screenshot editor</span></a><div class="exports"><button id="save">Save to library</button><button id="download">↓ Download PNG</button><button id="copy" class="primary">Copy image</button></div></header>
<main><div class="toolbar" role="toolbar" aria-label="Image editing tools"><div class="tools"><button data-tool="select" title="Select and move annotations (V)">↖ <span>Select</span></button><button data-tool="pen" class="active" title="Freehand pen (P)">✎ <span>Pen</span></button><button data-tool="rect" title="Rectangle (R)">□ <span>Rectangle</span></button><button data-tool="ellipse" title="Ellipse (E)">○ <span>Ellipse</span></button><button data-tool="arrow" title="Arrow (A)">↗ <span>Arrow</span></button><button data-tool="text" title="Text (T)">T <span>Text</span></button><button data-tool="redact" title="Solid black redaction (B)">■ <span>Redact</span></button><button data-tool="crop" title="Crop (C)">⌗ <span>Crop</span></button></div><div class="history"><button id="undo" title="Undo (⌘/Ctrl Z)">↶ Undo</button><button id="redo" title="Redo (⌘/Ctrl Shift Z)">↷ Redo</button><button id="deleteMark" title="Delete selected annotation">Delete</button></div></div>
<div class="options"><label>Color <input id="color" type="color" value="#4f7ff5"></label><label>Stroke <select id="stroke"><option value="2">2 px</option><option value="4" selected>4 px</option><option value="8">8 px</option><option value="12">12 px</option><option value="20">20 px</option></select></label><label>Text size <select id="fontSize"><option value="16">16 px</option><option value="24" selected>24 px</option><option value="36">36 px</option><option value="48">48 px</option><option value="72">72 px</option></select></label><div class="rotation-controls" role="group" aria-label="Selected annotation rotation"><label>Rotation <input id="rotation" type="number" min="0" max="360" step="1" value="0" aria-label="Annotation rotation in degrees" disabled>°</label><button id="rotateLeft" title="Rotate counterclockwise 15 degrees" aria-label="Rotate counterclockwise 15 degrees" disabled>↶</button><button id="rotateRight" title="Rotate clockwise 15 degrees" aria-label="Rotate clockwise 15 degrees" disabled>↷</button><button id="resetRotation" disabled>Reset</button></div><div class="zoom"><button id="zoomOut" aria-label="Zoom out">−</button><select id="zoom" aria-label="Image zoom"><option value="fit">Fit to view</option><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="zoomIn" aria-label="Zoom in">+</button></div><span id="dimensions"></span></div>
<div id="cropActions" hidden><b id="cropSize"></b><button id="applyCrop" class="primary">Apply crop</button><button id="cancelCrop">Cancel</button></div><p id="toolHint">Drag to draw. Choose Select to move, rotate, or delete an annotation.</p>
<div id="workspace"><div id="loading"><span class="loading-icon">▣</span><h1>Getting your screenshot ready.</h1><p id="loadHint">Finish selecting your capture source in the original tab.</p><button id="retry" hidden>Check again</button></div><div id="canvasHolder" hidden><canvas id="canvas" aria-label="Screenshot editing canvas"></canvas><canvas id="overlay" aria-label="Drawing surface"></canvas><textarea id="inlineText" aria-label="Annotation text" placeholder="Type here…" hidden></textarea></div></div>
<footer><span id="editorStatus" role="status">Waiting for screenshot…</span><span>LOCAL EDITING · PNG OUTPUT</span></footer></main><script type="module" src="assets/js/editor.js"></script></body></html>
