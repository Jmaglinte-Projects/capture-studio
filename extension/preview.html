<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recording preview · Capture Studio</title><link rel="stylesheet" href="assets/css/preview.css"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png"><link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png"></head><body>
<header><a class="brand" href="index.html"><img class="brand-icon" src="assets/icons/icon.svg" alt="" width="24" height="24"> <b>Capture Studio</b></a><a href="index.html?view=library">My captures ↗</a></header>
<main><div class="heading"><div><span class="eyebrow">RECORDING SAVED LOCALLY</span><h1 id="title">Your recording</h1><p id="details">Loading recording…</p></div><button id="download" class="primary" disabled>Download video</button></div>
